name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'   # audit P1.7c: 3.11 everywhere
      - name: Install (exact versions from the uv lockfile)
        run: pip install -r requirements.lock pytest
      - name: Repo size (every file < 100 KB, none near GitHub's 100 MB cap)
        run: python check_repo_size.py --top 15 --max-file-kb 100
      - name: Tests (offline; conftest blocks sockets)
        run: python -m pytest -q
